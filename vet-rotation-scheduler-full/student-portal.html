<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>פורטל סטודנטים – שנה ד׳ ברפואה וטרינרית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="st">
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --font:'IBM Plex Sans Hebrew','Rubik','Segoe UI',Arial,sans-serif;
  --bg:#EEF3F2;--surface:#FFFFFF;--surface-2:#F6F9F8;--ink:#12262A;--muted:#566A6D;--line:#D3DDDB;
  --scrub:#0E6B63;--scrub-ink:#FFFFFF;--scrub-soft:#D6ECE8;
  --me:#946300;--me-bg:#F5E7C4;--sec:#5B45A6;--sec-bg:#E5DFF5;--free:#1D62A3;--free-bg:#D9E7F5;--vac:#7F8C8F;
  --alarm:#B42318;--alarm-bg:#FCE3DF;--ok:#17744A;--ok-bg:#DAF0E3;--warn:#9A5B00;--warn-bg:#FBEBCD;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1618;--surface:#132124;--surface-2:#18292C;--ink:#E2EBE9;--muted:#95A7AA;--line:#28393C;
  --scrub:#3DB2A4;--scrub-ink:#07201D;--scrub-soft:#173A37;--me:#E6B84E;--me-bg:#3A2E11;--sec:#B6A6F2;--sec-bg:#2A2344;--free:#82B8EE;--free-bg:#15304B;--vac:#8E9C9F;
  --alarm:#FF8B7C;--alarm-bg:#3E1813;--ok:#6CD39B;--ok-bg:#143322;--warn:#F0B454;--warn-bg:#382810;}}
:root[data-theme="dark"]{
  --bg:#0C1618;--surface:#132124;--surface-2:#18292C;--ink:#E2EBE9;--muted:#95A7AA;--line:#28393C;
  --scrub:#3DB2A4;--scrub-ink:#07201D;--scrub-soft:#173A37;--me:#E6B84E;--me-bg:#3A2E11;--sec:#B6A6F2;--sec-bg:#2A2344;--free:#82B8EE;--free-bg:#15304B;--vac:#8E9C9F;
  --alarm:#FF8B7C;--alarm-bg:#3E1813;--ok:#6CD39B;--ok-bg:#143322;--warn:#F0B454;--warn-bg:#382810;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--scrub);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}
header{background:var(--scrub);color:var(--scrub-ink);padding:26px 0 0;margin-bottom:18px}
header .wrap{padding-bottom:0}
header h1{font-size:clamp(24px,5vw,32px);font-weight:700;letter-spacing:-.01em}
header p{margin:6px 0 0;opacity:.88;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;margin-bottom:14px}
.card h2{font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.card h2 .step{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--scrub-soft);color:var(--scrub);font-size:14px;font-weight:700}
.card .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.field{display:grid;gap:4px;margin-bottom:12px}
.field>span{font-size:14px;color:var(--muted)}
.field>span b{color:var(--alarm);font-weight:600}
input[type=text],input[type=email],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);min-width:0}
textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:540px){.grid2{grid-template-columns:1fr}}
.meter{font-size:13px;font-weight:600;padding:1px 10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.meter.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.meter.bad{background:var(--alarm-bg);color:var(--alarm);border-color:transparent}
.pick-row{display:grid;grid-template-columns:1fr 112px 40px;gap:6px;margin-bottom:8px}
.pick-row.fix{grid-template-columns:1fr 158px 40px}
@media (max-width:420px){.pick-row.fix{grid-template-columns:1fr 40px}.pick-row.fix input{grid-column:1;grid-row:2}}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;cursor:pointer;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-style:dashed;background:transparent}
.btn.primary{background:var(--scrub);border-color:var(--scrub);color:var(--scrub-ink);font-weight:600;padding:12px 22px;font-size:17px}
.notes{margin:8px 0 0;padding-inline-start:18px;font-size:14px;color:var(--muted)}
.notes b{color:var(--ink)}
.dow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.dow label{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:14px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chips button{appearance:none;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:3px 10px;font-size:14px;cursor:pointer}
.inline{display:flex;gap:8px;align-items:center}
.inline input{flex:1}
.errors{background:var(--alarm-bg);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.errors strong{display:block;margin-bottom:4px}
.errors ul{margin:0;padding-inline-start:18px}
.result{background:var(--surface);border:2px solid var(--scrub);border-radius:14px;padding:18px;margin-bottom:14px}
.result h2{font-size:20px;margin-bottom:6px}
.result textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;direction:ltr;text-align:left;min-height:110px;margin:8px 0}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.muted{color:var(--muted);font-size:14px}
details{margin-top:6px}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
.toast{position:fixed;inset-inline-start:50%;transform:translateX(50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw}
.toast.show{opacity:1}

:root{--core:#0E6B63;--core-bg:#D6ECE8;--vac-bg:#E7ECEC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--core:#6BD0C3;--core-bg:#163835;--vac-bg:#1B292B}}
:root[data-theme="dark"]{--core:#6BD0C3;--core-bg:#163835;--vac-bg:#1B292B}
.ptabs{display:flex;gap:2px;margin-top:16px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{appearance:none;border:0;background:transparent;color:inherit;opacity:.8;padding:10px 14px 12px;font-weight:500;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap}
.ptabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1;font-weight:600}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.danger{color:var(--alarm)}
.err{color:var(--alarm);font-size:14px;margin:8px 0 0}
.okmsg{color:var(--ok);font-size:14px}
.inline-check{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.me-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.now{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.now div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid}
.now .lbl{font-size:12px;color:var(--muted)}
.now b{font-size:17px}
.now small{color:var(--muted);font-size:13px}
.notice{background:var(--warn-bg);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.notice strong{display:block}
.upd{display:inline-block;margin-inline-start:6px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:8px;background:var(--warn);color:#fff;vertical-align:middle}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start}
.tl li.past{opacity:.5}
.tl li.current{background:var(--scrub-soft);border-radius:10px;padding:8px;margin:2px -8px;border-bottom:0}
.tl .when{font-size:12px;color:var(--muted);line-height:1.35}
.tl .when b{display:block;color:var(--ink);font-size:14px}
.tl .what{display:grid;gap:4px}
.chip{--c:var(--core);--cbg:var(--core-bg);background:var(--cbg);border-inline-start:3px solid var(--c);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:500;line-height:1.35}
.chip small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.cat-core{--c:var(--core);--cbg:var(--core-bg)}
.cat-me{--c:var(--me);--cbg:var(--me-bg)}
.cat-sec{--c:var(--sec);--cbg:var(--sec-bg)}
.cat-free{--c:var(--free);--cbg:var(--free-bg)}
.cat-vac{--c:var(--vac);--cbg:var(--vac-bg)}
.chip.cat-vac{background:repeating-linear-gradient(135deg,var(--vac-bg) 0 6px,transparent 6px 11px);color:var(--muted)}
.shl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.shl li{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.shl li.past{opacity:.5}
.pill{font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;margin-inline-start:auto}
.pill.er{background:var(--alarm-bg);color:var(--alarm)}
.pill.dept{background:var(--sec-bg);color:var(--sec)}
.radios{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.radio{display:flex;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer;font-size:15px}
.radio:has(input:checked){border-color:var(--scrub);background:var(--scrub-soft)}
.foot{text-align:center;margin-top:30px}
.cal{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:10px;margin:8px 0}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.calnav b{font-size:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calgrid .dh{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.cd{appearance:none;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;line-height:1.1;min-width:0}
.cd small{font-size:9.5px;font-weight:500;color:var(--warn);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd.hol{border-color:var(--warn);background:var(--warn-bg)}
.cd.on{background:var(--alarm);border-color:var(--alarm);color:#fff}
.cd.on small{color:#fff}
.cd.bydow{background:repeating-linear-gradient(135deg,var(--alarm) 0 5px,color-mix(in srgb,var(--alarm) 75%,#000) 5px 10px)}
.cd.off{background:transparent;border-color:transparent;color:var(--muted);opacity:.4;cursor:default;font-weight:400}
.callegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:8px}
.callegend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-inline-end:4px;border:1px solid var(--line);background:var(--surface)}
.callegend i.hol{background:var(--warn-bg);border-color:var(--warn)}
.callegend i.on{background:var(--alarm);border-color:var(--alarm)}
.linkbtn{appearance:none;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer}
</style>
</head>

    <label class="field"><span>בקשות חברתיות (לא חובה), למשל סטודנטים שהייתם רוצים להיות איתם בבלוק</span><textarea data-f="qa" data-q="social" maxlength="400">${esc(f.qa.social || '')}</textarea></label>
<label class="field"><span>בקשות אישיות והערות חשובות</span><textarea data-f="notes" maxlength="1000">${esc(f.notes)}</textarea></label>
${ext.length ? `<label class="field"><span>קישורים לטפסי ההסכמה החתומים של הבלוקים החיצוניים (אם יש)</span><textarea data-f="qa" data-q="consent" maxlength="600" placeholder="קישור לקובץ בדרייב או הערה שהטפסים יישלחו בנפרד">${esc(f.qa.consent || '')}</textarea></label>` : ''}
  </section>
  <div class="row-btns" style="margin:18px 0"><button class="btn primary" data-act="make">הפקת קוד בקשה</button></div>
  <details><summary>טעינת קוד קודם לעריכה</summary>
    <textarea id="loadBox" style="margin-top:8px;direction:ltr;text-align:left" placeholder="VR1...."></textarea>
    <button class="btn" data-act="load" style="margin-top:6px">טעינה</button>
  </details>
  <details><summary>התחלה מחדש</summary><button class="btn" data-act="reset" style="margin-top:6px">ניקוי הטופס</button></details>`;
}
function check() {
  const e = [];
  if (!f.name.trim()) e.push('חסר שם מלא');
  e.push(...validateChoices(f));
  if (!f.secBk || !f.secBk.c) e.push('חסר בלוק גיבוי לבחירה משנית');
  if (!f.freeBk || !f.freeBk.c) e.push('חסר בלוק גיבוי לבחירה חופשית');
  const chosenAll = chosenCourses();
  [['secBk', 'משנית'], ['freeBk', 'חופשית']].forEach(([k, l]) => { if (f[k] && chosenAll.includes(f[k].c)) e.push(`בלוק הגיבוי לבחירה ה${l} כבר נמצא בין הבחירות – בחרו בלוק אחר`); });
  if (f.skills) { const dw = f.free.filter(r => f.skillsDrop.includes(r.c)).reduce((a, r) => a + (+r.w || 0), 0); if (dw !== 2) e.push(`בלוק מיומנויות: סמנו בלוקים מהבחירה החופשית שמסתכמים בשבועיים לוויתור (כרגע ${dw})`); }
  const chosen = chosenCourses();
  f.fixed.forEach((r, i) => { if (!r.c || !r.d) e.push(`בלוק בתאריך קבוע ${i + 1}: חסר קורס או תאריך`); else if (!chosen.includes(r.c)) e.push(`בלוק בתאריך קבוע ${i + 1}: הקורס אינו בין הבחירות`); });
  return e;
}
function build() {
  return cleanRequest({v: 1, rid: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), at: Date.now(), name: f.name, sno: f.sno, contact: f.contact,
    me: f.me, sec: f.sec, free: f.free, ext: chosenCourses().some(k => C[k].ext) ? f.ext : '', vac: f.vac.filter(Boolean), fixed: f.fixed, sh: f.sh, notes: f.notes,
    secBk: f.secBk, freeBk: f.freeBk, skills: f.skills, skillsDrop: f.skills ? f.skillsDrop.filter(k => f.free.some(r => r.c === k)) : [], tech: f.tech, early: f.early, qa: f.qa});
}

// ---------- admin: publish a bundle prepared in the coordinator app ----------
function buildDoc(bundle) {
  const css = document.getElementById('st').textContent, js = document.getElementById('main').textContent;
  const data = JSON.stringify(bundle || null).replace(/</g, '\\u003c');
  return '<!doctype html>\n<html lang="he" dir="rtl">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>' + PORTAL_TITLE + '</title>\n'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">\n'
    + '<style id="st">' + css + '</style>\n</head>\n<body>\n<div id="root"></div>\n<div id="toast" class="toast" role="status" aria-live="polite"></div>\n'
    + '<script type="application/json" id="pubdata">' + data + '</scr' + 'ipt>\n<script id="main">' + js + '</scr' + 'ipt>\n</body>\n</html>\n';
}
function adminHtml() {
  const cur = PUB ? `גרסה ${PUB.ver} פורסמה ב-${fmtDY(new Date(PUB.pub))}, ${PUB.entries.length} סטודנטים.` : 'עדיין לא פורסם לו״ז.';
  return `<section class="card"><h2>פרסום הלו״ז לסטודנטים</h2><p class="sub">${cur}</p>
    <p class="sub">באפליקציית השיבוץ, בלשונית "פרסום", מכינים חבילת פרסום. מדביקים אותה כאן או טוענים את הקובץ, ומפרסמים. הלוחות מוצפנים, וכל סטודנט רואה רק את שלו עם הקוד האישי.</p>
    <textarea id="bundleIn" style="direction:ltr;min-height:90px" placeholder='{"kind":"vrpub",...}'></textarea>
    <div class="row-btns" style="margin-top:8px"><button class="btn" data-act="a-check">בדיקת החבילה</button><button class="btn" data-act="a-file">מקובץ</button></div>
    ${adminMsg ? `<p class="${adminBundle ? 'okmsg' : 'err'}">${esc(adminMsg)}</p>` : ''}
    ${adminBundle ? `<div class="row-btns"><button class="btn primary" data-act="a-publish">פרסום גרסה ${adminBundle.ver}</button></div>` : ''}
    ${PUB ? `<details style="margin-top:14px"><summary>הסרת הלו״ז מהפורטל</summary><p class="sub">הפורטל יחזור למצב "טרם פורסם". טופס ההעדפות נשאר.</p><button class="btn danger" data-act="a-unpublish">הסרה</button></details>` : ''}
    <input type="file" id="bundleFile" accept=".json,application/json,.txt" hidden></section>`;
}
function parseBundle(text) {
  try { const o = JSON.parse(String(text).trim()); if (!validBundle(o)) throw new Error('bad'); return o; } catch (e) { return null; }
}
async function doPublish(bundle) {
  if (!artifactNs) { toast('פרסום זמין רק בתצוגה של בעל/ת הדף ב-Claude.'); return; }
  try { await artifactNs.publish(buildDoc(bundle)); toast('פורסם. הדף נטען מחדש.'); }
  catch (e) {
    const c = e && e.code;
    if (c === 'conflict') return;
    adminMsg = c === 'not_writer' || c === 'not_granted' || c === 'consent_required' ? 'לתצוגה הזו אין הרשאת פרסום. פתחו את הפורטל מהחשבון של בעל/ת הדף.' : c === 'too_large' ? 'החבילה גדולה מדי לפרסום.' : c === 'rate_limited' ? 'פרסמתם הרגע – נסו שוב בעוד דקה.' : 'הפרסום נכשל. נסו שוב.';
    adminBundle = null; render();
  }
}

// ---------- shell ----------
function render() {
  const tabs = [['mine', 'הלו״ז שלי'], ['change', 'בקשת שינוי'], ['pref', 'העדפות לתחילת שנה']];
  if (canEdit || adminOpen) tabs.push(['admin', 'ניהול']);
  const body = tab === 'mine' ? mineHtml() : tab === 'change' ? changeHtml() : tab === 'admin' ? adminHtml() : prefHtml();
  document.getElementById('root').innerHTML = `<header><div class="wrap"><h1>פורטל סטודנטים</h1><p>שנה ד׳ ברפואה וטרינרית, תשפ״ז</p>
    <nav class="ptabs" role="tablist">${tabs.map(([k, t]) => `<button role="tab" aria-selected="${tab === k}" data-act="tab" data-v="${k}">${t}</button>`).join('')}</nav></div></header>
    <main class="wrap">${body}${!canEdit && !adminOpen ? '<p class="foot"><button class="linkbtn" data-act="admin-open">כניסת רכז/ת</button></p>' : ''}</main>`;
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, i = +t.dataset.i;
  switch (a) {
    case 'tab': tab = t.dataset.v; render(); window.scrollTo(0, 0); return;
    case 'admin-open': adminOpen = true; tab = 'admin'; render(); return;
    case 'login': { const code = document.getElementById('codeIn').value; if (!normCode(code)) { loginErr = 'הזינו את הקוד.'; render(); return; } login(code, document.getElementById('remember').checked); return; }
    case 'logout': logout(); return;
    case 'cal-open': { const st = cal[t.dataset.k]; st.open = !st.open; break; }
    case 'cal-nav': { const st = cal[t.dataset.k], [y, m] = st.m.split('-').map(Number), d = new Date(y, m - 1 + (+t.dataset.v), 1); st.m = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; break; }
    case 'cal-day': case 'cal-del': {
      const k = t.dataset.k, o = k === 'pref' ? f.sh : chg;
      if (a === 'cal-del') o.dates.splice(i, 1);
      else {
        const d = t.dataset.d, dw = new Date(d + 'T12:00:00').getDay();
        if (o.dows.includes(dw)) { toast(dw === 6 ? 'כל השבתות כבר מסומנות. לביטול: הסירו את הסימון "כל השבתות".' : 'כל ימי שישי כבר מסומנים. לביטול: הסירו את הסימון "כל ימי שישי".'); return; }
        const s = new Set(o.dates); if (s.has(d)) s.delete(d); else s.add(d); o.dates = [...s].sort();
      }
      if (k === 'pref') result = null; else chgResult = null;
      break;
    }
    case 'c-date-add': { const v = document.getElementById('cDateNew').value; if (!v) { toast('בחרו תאריך.'); return; } if (!chg.dates.includes(v)) chg.dates.push(v); chg.dates.sort(); break; }
    case 'c-date-del': chg.dates.splice(i, 1); break;
    case 'c-make': chgErrors = checkChange(); chgResult = chgErrors.length ? null : encodeRequest(buildChange()); render(); window.scrollTo(0, 0); return;
    case 'c-copy': copyText(chgResult, document.getElementById('chgBox')); return;
    case 'c-download': saveTxt(`bakashat-shinui-${(me && me.name || 'student').replace(/\s+/g, '-')}.txt`, chgResult); return;
    case 'c-new': chg = {type: 'shift', dows: [], dates: [], from: '', to: '', vd: '', fc: '', fd: '', unit: '', nc: '', why: ''}; chgResult = null; chgErrors = []; break;
    case 'a-check': { const b = parseBundle(document.getElementById('bundleIn').value); adminBundle = b; adminMsg = b ? `חבילה תקינה: גרסה ${b.ver}, ${b.entries.length} סטודנטים, הוכנה ב-${fmtDY(new Date(b.pub))}.` : 'זו לא חבילת פרסום תקינה. העתיקו אותה שוב מאפליקציית השיבוץ.'; break; }
    case 'a-file': document.getElementById('bundleFile').click(); return;
    case 'a-publish': if (adminBundle) doPublish(adminBundle); return;
    case 'a-unpublish': doPublish(null); return;
    // preferences form
    case 'row-add': f[t.dataset.cat].push({c: '', w: 2}); break;
    case 'row-del': f[t.dataset.cat].splice(i, 1); break;
    case 'fix-add': f.fixed.push({c: '', d: ''}); break;
    case 'fix-del': f.fixed.splice(i, 1); break;
    case 'shd-add': { const v = document.getElementById('shNew').value; if (!v) { toast('בחרו תאריך.'); return; } if (!f.sh.dates.includes(v)) f.sh.dates.push(v); f.sh.dates.sort(); break; }
    case 'shd-del': f.sh.dates.splice(i, 1); break;
    case 'make': errors = check(); result = errors.length ? null : encodeRequest(build()); render(); window.scrollTo(0, 0); saveDraft(); return;
    case 'copy': copyText(result, document.getElementById('codeBox')); return;
    case 'download': saveTxt(`bakasha-${(f.name || 'student').replace(/\s+/g, '-')}.txt`, result); return;
    case 'back': result = null; break;
    case 'load': {
      const code = findCodes(document.getElementById('loadBox').value)[0];
      try { const o = decodeRequest(code || ''); if (o.k === 'chg') throw new Error('chg'); const c = cleanRequest(o); f = {...blank(), ...c, vac: [...c.vac, '', '', ''].slice(0, 3)}; result = null; errors = []; toast('הבקשה נטענה. אפשר לערוך ולהפיק קוד חדש.'); }
      catch (err) { toast('הקוד אינו תקין או שהועתק חלקית.'); return; }
      break;
    }
    case 'reset': f = blank(); result = null; errors = []; break;
    default: return;
  }
  saveDraft(); render();
});
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset.f;
  if (['name', 'sno', 'contact', 'ext', 'notes', 'early'].includes(k)) { f[k] = t.value; saveDraft(); }
else if (k === 'qa') { f.qa = {...f.qa, [t.dataset.q]: t.value}; saveDraft(); }
  else if (k === 'why') { f.sh.why = t.value; saveDraft(); }
  else if (k === 'c-why') chg.why = t.value;
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.f, i = +t.dataset.i;
  if (t.id === 'bundleFile') { const file = t.files && t.files[0]; t.value = ''; if (file) file.text().then(txt => { document.getElementById('bundleIn').value = txt; const b = parseBundle(txt); adminBundle = b; adminMsg = b ? `חבילה תקינה: גרסה ${b.ver}, ${b.entries.length} סטודנטים.` : 'זו לא חבילת פרסום תקינה.'; render(); }); return; }
  if (k && k.startsWith('c-')) {
    if (k === 'c-type') { chg.type = t.value; chgErrors = []; chgResult = null; }
    else if (k === 'c-dow') { const s = new Set(chg.dows); t.checked ? s.add(i) : s.delete(i); chg.dows = [...s].sort(); return; }
    else if (k === 'c-from') chg.from = t.value;
    else if (k === 'c-to') { chg.to = t.value; return; }
    else if (k === 'c-vd') { chg.vd = t.value; return; }
    else if (k === 'c-fc') chg.fc = t.value;
    else if (k === 'c-fd') { chg.fd = t.value; return; }
    else if (k === 'c-unit') { chg.unit = t.value; chg.nc = ''; }
    else if (k === 'c-nc') chg.nc = t.value;
    else return;
    setTimeout(render, 0); return;
  }
  if (k === 'cal-dow') { const o = t.dataset.k === 'pref' ? f.sh : chg, s = new Set(o.dows); if (t.checked) s.add(i); else s.delete(i); o.dows = [...s].sort(); if (t.dataset.k === 'pref') { result = null; saveDraft(); } else chgResult = null; setTimeout(render, 0); return; }
  if (k === 'me') f.me = t.value;
  else if (k === 'qa') { f.qa = {...f.qa, [t.dataset.q]: t.value}; saveDraft(); return; }
else if (k === 'bk-c') { const key = t.dataset.cat === 'sec' ? 'secBk' : 'freeBk', c = C[t.value]; f[key] = c ? {c: t.value, w: c.len[c.len.length - 1]} : null; }
  else if (k === 'bk-w') { const key = t.dataset.cat === 'sec' ? 'secBk' : 'freeBk'; if (f[key]) f[key].w = +t.value; }
  else if (k === 'skills') { f.skills = t.checked; if (!f.skills) f.skillsDrop = []; }
  else if (k === 'skdrop') { const st = new Set(f.skillsDrop); t.checked ? st.add(t.dataset.c) : st.delete(t.dataset.c); f.skillsDrop = [...st]; }
  else if (k === 'tech') f.tech = t.checked;
  else if (k === 'rowc') { const r = f[t.dataset.cat][i]; r.c = t.value; const c = C[r.c]; if (c && !c.len.includes(+r.w)) r.w = c.len[0]; }
  else if (k === 'roww') f[t.dataset.cat][i].w = +t.value;
  else if (k === 'vac') { f.vac[i] = t.value; saveDraft(); return; }
  else if (k === 'fixc') f.fixed[i].c = t.value;
  else if (k === 'fixd') { f.fixed[i].d = t.value; saveDraft(); return; }
  else if (k === 'dow') { const s = new Set(f.sh.dows); t.checked ? s.add(i) : s.delete(i); f.sh.dows = [...s].sort(); saveDraft(); return; }
  else return;
  if (result) result = null;
  saveDraft(); setTimeout(render, 0);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'codeIn') { e.preventDefault(); document.querySelector('[data-act=login]').click(); } });

render();
(async () => {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const [dl, art, usr] = await Promise.all([window.claude.use('downloads').catch(() => null), window.claude.use('artifact').catch(() => null), window.claude.use('user').catch(() => null)]);
      downloads = dl; artifactNs = art;
      if (usr) { try { canEdit = !!(await usr.canEdit()); } catch (e) {} }
      render();
    }
  } catch (e) {}
})();
const saved = lsGet(LS_CODE);
if (PUB && saved) login(saved, true);
</script>
</body>
</html>
