<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שיבוץ בלוקים קליניים – שנה ד׳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --font:'IBM Plex Sans Hebrew','Rubik','Segoe UI',Arial,sans-serif;
  --bg:#EEF3F2; --surface:#FFFFFF; --surface-2:#F6F9F8; --ink:#12262A; --muted:#566A6D; --line:#D3DDDB;
  --scrub:#0E6B63; --scrub-ink:#FFFFFF; --scrub-soft:#D6ECE8;
  --core:#0E6B63; --core-bg:#D6ECE8;
  --me:#946300; --me-bg:#F5E7C4;
  --sec:#5B45A6; --sec-bg:#E5DFF5;
  --free:#1D62A3; --free-bg:#D9E7F5;
  --vac:#7F8C8F; --vac-bg:#E7ECEC;
  --alarm:#B42318; --alarm-bg:#FCE3DF;
  --ok:#17744A; --ok-bg:#DAF0E3;
  --warn:#9A5B00; --warn-bg:#FBEBCD;
  --shadow:0 12px 40px rgba(10,40,40,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1618; --surface:#132124; --surface-2:#18292C; --ink:#E2EBE9; --muted:#95A7AA; --line:#28393C;
    --scrub:#3DB2A4; --scrub-ink:#07201D; --scrub-soft:#173A37;
    --core:#6BD0C3; --core-bg:#163835;
    --me:#E6B84E; --me-bg:#3A2E11;
    --sec:#B6A6F2; --sec-bg:#2A2344;
    --free:#82B8EE; --free-bg:#15304B;
    --vac:#8E9C9F; --vac-bg:#1B292B;
    --alarm:#FF8B7C; --alarm-bg:#3E1813;
    --ok:#6CD39B; --ok-bg:#143322;
    --warn:#F0B454; --warn-bg:#382810;
    --shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1618; --surface:#132124; --surface-2:#18292C; --ink:#E2EBE9; --muted:#95A7AA; --line:#28393C;
  --scrub:#3DB2A4; --scrub-ink:#07201D; --scrub-soft:#173A37;
  --core:#6BD0C3; --core-bg:#163835;
  --me:#E6B84E; --me-bg:#3A2E11;
  --sec:#B6A6F2; --sec-bg:#2A2344;
  --free:#82B8EE; --free-bg:#15304B;
  --vac:#8E9C9F; --vac-bg:#1B292B;
  --alarm:#FF8B7C; --alarm-bg:#3E1813;
  --ok:#6CD39B; --ok-bg:#143322;
  --warn:#F0B454; --warn-bg:#382810;
  --shadow:0 12px 40px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--scrub);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding:18px clamp(14px,3vw,32px) 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand h1{font-size:clamp(20px,2.6vw,26px);font-weight:700;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.top-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.save-state{font-size:13px;color:var(--muted)}
.savebox{display:flex;flex-direction:column;align-items:center;gap:2px}
.btn.savebtn{min-height:44px;padding:8px 22px;font-size:16px;font-weight:700;border-radius:12px;background:var(--surface);border:2px solid var(--line);color:var(--ink)}
.btn.savebtn.dirty{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.savebtn.saving{opacity:.75;cursor:progress}
.btn.savebtn.ok{border-color:var(--ok,#2d7a4a);color:var(--ok,#2d7a4a)}
.btn.savebtn.err{background:var(--alarm);border-color:var(--alarm);color:#fff}
.save-state{max-width:240px;text-align:center;line-height:1.3}
.save-state.err{color:var(--alarm)}

.tabs{display:flex;gap:4px;padding:0 clamp(10px,3vw,28px);background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:12px 12px 10px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--scrub);font-weight:600}
.tab .n{display:inline-block;min-width:20px;margin-inline-start:6px;padding:0 6px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;text-align:center}
.tab .n.bad{background:var(--alarm-bg);border-color:transparent;color:var(--alarm)}

main{padding:18px clamp(12px,3vw,32px) 48px;max-width:1800px;margin:0 auto}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--scrub);border-color:var(--scrub);color:var(--scrub-ink);font-weight:600;padding:9px 18px}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-style:dashed}
.btn.danger{color:var(--alarm)}
.btn.danger.armed{background:var(--alarm);color:#fff;border-color:var(--alarm)}
.btn.sm{padding:5px 10px;font-size:13px}
.icon-btn{appearance:none;border:1px solid transparent;background:none;width:34px;height:34px;border-radius:8px;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar .spacer{flex:1}
.inline-field{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.inline-field input{width:64px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:14px;border:1px solid transparent}
.banner.warn{background:var(--warn-bg);color:var(--ink);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.bad{background:var(--alarm-bg);border-color:color-mix(in srgb,var(--alarm) 30%,transparent)}
.banner.ok{background:var(--ok-bg)}
.banner strong{display:block;margin-bottom:2px}
.banner .btn{margin-inline-start:auto}

.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 14px;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.stats b{color:var(--ink);font-size:17px;font-weight:600;margin-inline-end:4px}
.stats .bad b{color:var(--alarm)}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--cbg);border-inline-start:3px solid var(--c)}

/* ---- rotation board ---- */
.board-wrap{container-type:inline-size;overflow:auto;max-height:min(74vh,1100px);border:1px solid var(--line);border-radius:12px;background:var(--surface);overscroll-behavior:contain}
table.board{border-collapse:separate;border-spacing:0;font-size:12px}
.board th,.board td{padding:3px;border-bottom:1px solid var(--line)}
.board thead th{position:sticky;top:0;z-index:2;background:var(--surface);font-weight:600;text-align:center;padding:8px 3px 6px;border-bottom:2px solid var(--line)}
.board thead th small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.board td,.board thead th:not(.name){width:var(--bw,106px);min-width:var(--bw,106px);max-width:var(--bw,106px)}
.board .name{position:sticky;inset-inline-start:0;z-index:1;background:var(--surface);min-width:132px;max-width:170px;text-align:start;border-inline-end:1px solid var(--line);padding-inline:10px 6px}
.board thead .name{z-index:3;text-align:start}
.board tbody tr:hover .name{background:var(--surface-2)}
.name-btn{appearance:none;border:0;background:none;padding:0;cursor:pointer;font-weight:600;text-align:start;display:flex;align-items:center;gap:6px;max-width:100%}
.name-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.bad{background:var(--alarm)}
.dot.warn{background:var(--warn)}
.cell{display:flex;gap:2px;height:36px;border-radius:8px}
.cell.conflict{box-shadow:0 0 0 3px #ff8a80,0 0 0 6px rgba(255,138,128,.28)}
.cell.approved{box-shadow:0 0 0 3px #f1c453}
.chip.j1{border-start-end-radius:0;border-end-end-radius:0}
.chip.j2{border-start-start-radius:0;border-end-start-radius:0;margin-inline-start:-2px;border-inline-start:1px dashed color-mix(in srgb,var(--c) 60%,transparent)}
.zw .cell .chip{font-size:var(--fc,12px);padding:0 5px}
.board thead .wks,.dept thead .wks,.load thead .wks{display:grid;grid-template-columns:1fr 1fr;margin-top:2px;gap:2px}
.board thead .wks small,.dept thead .wks small,.load thead .wks small{display:block;font-weight:400;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board thead .wks.hol small,.dept thead .wks.hol small,.load thead .wks.hol small{color:var(--warn);font-weight:700;font-size:10.5px}
.chip{--c:var(--core);--cbg:var(--core-bg);appearance:none;flex:1 1 0;min-width:0;border:0;border-radius:6px;padding:0 6px;background:var(--cbg);border-inline-start:3px solid var(--c);color:var(--ink);font-size:12px;font-weight:500;line-height:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:start;position:relative}
.chip.half{font-size:10.5px;padding:0 3px}
.chip.lock::after{content:"";position:absolute;top:4px;inset-inline-end:4px;width:6px;height:6px;border-radius:1px;background:var(--c);box-shadow:0 0 0 2px var(--cbg)}
.cat-core{--c:var(--core);--cbg:var(--core-bg)}
.cat-me{--c:var(--me);--cbg:var(--me-bg)}
.cat-sec{--c:var(--sec);--cbg:var(--sec-bg)}
.cat-free{--c:var(--free);--cbg:var(--free-bg)}
.cat-vac{--c:var(--vac);--cbg:var(--vac-bg)}
.chip.cat-vac{background:repeating-linear-gradient(135deg,var(--vac-bg) 0 6px,transparent 6px 11px);color:var(--muted)}
.chip.conflict{box-shadow:inset 0 0 0 2px var(--alarm)}
.chip.ext{border-inline-start-style:dashed}
.board td.wide{max-width:none}
.zw.z4{--bw:max(150px,calc((100cqw - 178px) / 4));--fs:15px;--fsh:13px;--fc:14.5px}
.zw.z6{--bw:max(150px,calc((100cqw - 178px) / 6));--fs:14px;--fsh:12px;--fc:13px}
.zw.z9{--bw:max(120px,calc((100cqw - 178px) / 9));--fs:12.5px;--fsh:11px;--fc:11.5px}
.zw.z13{--bw:max(96px,calc((100cqw - 178px) / 13));--fs:12px;--fsh:10.5px;--fc:10.5px}
.zw .chip{font-size:var(--fs,12px)}
.zw .chip.half{font-size:var(--fsh,10.5px)}
.zw thead th:not(.name){font-size:calc(var(--fs,12px) + 1px)}
.pc{--c:hsl(var(--h) 58% 36%);--cbg:hsl(var(--h) 72% 92%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pc{--c:hsl(var(--h) 62% 64%);--cbg:hsl(var(--h) 34% 21%)}}
:root[data-theme="dark"] .pc{--c:hsl(var(--h) 62% 64%);--cbg:hsl(var(--h) 34% 21%)}
.board tr.grp-row th{background:var(--surface-2);text-align:start;padding:9px 0 7px;border-bottom:1px solid var(--line);border-top:2px solid var(--line);font-size:13.5px;font-weight:700}
.board tr.grp-row th span{position:sticky;inset-inline-start:0;padding-inline:12px;display:inline-flex;gap:8px;align-items:baseline}
.board tr.grp-row th small{color:var(--muted);font-weight:400;font-size:12px}
.unsched{color:var(--muted);font-size:13px;padding:0 10px}
@media (max-width:600px){.board .name{min-width:104px;max-width:112px;padding-inline:6px 4px}.board td,.board thead th:not(.name){width:var(--bw,92px);min-width:var(--bw,92px);max-width:var(--bw,92px)}}

/* ---- by department (like the "בלוקים" sheet) ---- */
table.dept{border-collapse:separate;border-spacing:0;font-size:12px}
.dept th,.dept td{border-bottom:1px solid var(--line);vertical-align:top}
.dept thead th{position:sticky;top:0;z-index:2;background:var(--surface);font-weight:600;text-align:center;padding:8px 4px 6px;border-bottom:2px solid var(--line)}
.dept thead th small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.dept .name{position:sticky;inset-inline-start:0;z-index:1;background:var(--surface);min-width:124px;max-width:150px;text-align:start;border-inline-end:1px solid var(--line);padding:6px 10px;font-weight:600}
.dept thead .name{z-index:3}
.dept tbody .name small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.dept td.dc{width:var(--bw,122px);min-width:var(--bw,122px);max-width:var(--bw,122px);padding:4px;border-inline-start:1px solid var(--line)}
.dept thead th:not(.name){width:var(--bw,122px);min-width:var(--bw,122px);max-width:var(--bw,122px)}
.dept thead .wks{display:grid;grid-template-columns:1fr 1fr;margin-top:2px}
.dept thead .wks small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.dg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 3px;grid-auto-flow:row dense;align-content:start}
.dh{font-size:11px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;padding:1px 0 2px;border-radius:4px}
.dh.over{color:var(--alarm);font-weight:700;background:var(--alarm-bg)} .dh.under{color:var(--warn);font-weight:700;background:var(--warn-bg)} .dh.spare{color:var(--warn);font-weight:700}
.dg .nm{margin:0}
.nm.s2{grid-column:1 / -1} .nm.w1{grid-column:1} .nm.w2{grid-column:2}
.zw .nm{font-size:var(--fs,11.5px)} .zw .dh{font-size:calc(var(--fs,12px) - 1px)}
.dept td.dc.pre{width:150px;min-width:150px;max-width:150px;background:var(--surface-2)}
.dc-h{font-size:11px;color:var(--muted);text-align:center;margin-bottom:3px;font-variant-numeric:tabular-nums}
.dc.over,.drow.over{background:var(--alarm-bg)}
.dc.over .dc-h,.drow.over .cnt{color:var(--alarm);font-weight:700}
.dc.under,.drow.under{background:var(--warn-bg)}
.dc.under .dc-h,.drow.under .cnt{color:var(--warn);font-weight:700}
.dc.closed{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 11px)}
.nm{appearance:none;display:flex;align-items:baseline;justify-content:space-between;gap:4px;width:100%;border:0;border-inline-start:3px solid var(--c);background:var(--cbg);color:var(--ink);border-radius:4px;padding:2px 5px;margin:0 0 2px;font:inherit;font-size:11.5px;line-height:1.35;text-align:start;cursor:pointer}
.nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nm small{flex:none;color:var(--muted);font-size:.8em}
.nm.hi{box-shadow:inset 0 0 0 2px var(--ink);font-weight:700}
.nm.dim{opacity:.4}
.others{display:block;color:var(--muted);font-size:11px;padding:1px 4px}
.drow .others{display:inline;align-self:center}
.nm:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.dlist{display:grid;gap:6px}
.drow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.drow .dk b{display:block;font-size:14px}
.drow .dk small{display:block;color:var(--muted);font-size:12px}
.drow .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.drow .dn{display:flex;flex-wrap:wrap;gap:4px}
.drow .dn .nm{width:auto;max-width:100%;margin:0;font-size:12.5px;padding:3px 8px}
.drow .empty-n{color:var(--muted);font-size:12.5px}
@media (max-width:600px){.drow{grid-template-columns:1fr;gap:6px}.drow .dk{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.drow .dk b,.drow .dk small{display:inline}}

/* ---- shifts ---- */
.shchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.shc:not(.pc){--c:var(--muted);--cbg:var(--surface-2)}
.shc{display:inline-grid;grid-template-columns:auto;gap:0;min-width:92px;padding:4px 8px 5px;border-radius:8px;background:var(--cbg);border-inline-start:3px solid var(--c);font-size:11.5px;line-height:1.35;color:var(--ink);position:relative}
.shc b{font-size:12.5px;font-variant-numeric:tabular-nums}
.shc span{color:var(--muted);white-space:nowrap}
.shc em{font-style:normal;font-size:10px;font-weight:700;color:var(--warn)}
.shc i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--ok,#2d7a4a)}
.shc.nodept{border-inline-start-style:dashed}
.shc.bad{box-shadow:0 0 0 2px #ff8a80}
.names button small{color:var(--muted);font-weight:400}

.staff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px}
.panel.staff h2{margin-bottom:4px}
.gs-card{border:2px solid var(--scrub)}
/* ---- social ---- */
table.soc{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface)}
.soc th,.soc td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.soc thead th{font-weight:600;color:var(--muted);font-size:12.5px}
.soc .barc{min-width:170px}
.soc .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:4px}
.soc .bar i{display:block;height:100%;background:var(--accent,var(--core));border-radius:99px}
.soc .barc b{margin-inline-end:8px}
.soc .barc small{color:var(--muted)}
.fr{display:inline-flex;align-items:center;gap:4px;margin:2px;padding:2px 9px;border-radius:99px;background:var(--core-bg);color:var(--ink);font-size:12.5px;white-space:nowrap}
.fr.none{background:var(--alarm-bg);color:var(--alarm)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}

/* ---- load map ---- */
table.load{border-collapse:separate;border-spacing:0;font-size:11px}
.load th,.load td{border-bottom:1px solid var(--line);padding:0}
.load thead th{position:sticky;top:0;background:var(--surface);z-index:2;font-weight:600;padding:6px 0;text-align:center;border-bottom:2px solid var(--line)}
.load .name{position:sticky;inset-inline-start:0;background:var(--surface);z-index:1;min-width:150px;padding:4px 10px;text-align:start;font-size:12px;border-inline-end:1px solid var(--line);white-space:nowrap}
.load thead .name{z-index:3}
.load .name small{color:var(--muted);margin-inline-start:4px}
.load td.v{width:24px;min-width:24px;height:26px;text-align:center;color:var(--ink)}
.load td.v.l1{background:color-mix(in srgb,var(--scrub) 14%,transparent)}
.load td.v.l2{background:color-mix(in srgb,var(--scrub) 34%,transparent)}
.load td.v.l3{background:color-mix(in srgb,var(--scrub) 58%,transparent);color:var(--scrub-ink)}
.load td.v.over{background:var(--alarm);color:#fff;font-weight:700}
.load td.v.spare{background:repeating-linear-gradient(135deg,var(--warn) 0 5px,color-mix(in srgb,var(--warn) 70%,var(--alarm)) 5px 10px);color:#fff;font-weight:700}
.dc.spare,.drow.spare{background:color-mix(in srgb,var(--warn) 22%,transparent)}

.selbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.selbar .inline-check{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.srow h3 input[type=checkbox],.selbar input[type=checkbox]{width:18px;height:18px;margin:0;flex:none;cursor:pointer;accent-color:var(--alarm)}
.srow.sel{border-color:var(--alarm);background:color-mix(in srgb,var(--alarm-bg) 45%,var(--surface))}
@media (max-width:720px){.srow{grid-template-columns:1fr auto}.srow .choices{grid-column:1/-1;grid-row:2}}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:32px clamp(16px,4vw,40px);max-width:680px}
.empty h2{font-size:20px;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 0 16px}

details.paste{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:16px}
details.paste summary{cursor:pointer;font-weight:500}
details.paste textarea{width:100%;min-height:110px;margin:10px 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}

/* ---- settings ---- */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.panel h2{font-size:17px;margin-bottom:10px}
.panel p.hint{color:var(--muted);font-size:13px;margin:4px 0 12px}
.field{display:grid;gap:4px;margin-bottom:12px;font-size:14px}
.field>span{color:var(--muted);font-size:13px}
.field input,.field select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbl-wrap{overflow-x:auto}
table.plain{border-collapse:collapse;width:100%;font-size:13px}
.plain th,.plain td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.plain th{color:var(--muted);font-weight:500;font-size:12px}
.plain tfoot td{font-weight:600;border-bottom:0}
.plain input{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.num{text-align:center!important}
ul.rules{margin:0;padding-inline-start:18px;font-size:14px}
ul.rules li{margin-bottom:6px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--alarm-bg);color:var(--alarm)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* ---- sheet ---- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-start}
.sheet[hidden]{display:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(8,20,22,.45)}
.sheet-panel{position:relative;width:min(560px,100%);height:100%;background:var(--surface);box-shadow:var(--shadow);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);animation:slidein .18s ease-out}

.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}

.meter.bad{background:var(--alarm-bg);color:var(--alarm);border-color:transparent}
.pick-row{display:flex;gap:6px;margin-bottom:6px}

select.full{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.slot-picks{display:flex;flex-wrap:wrap;gap:5px}

.notes{font-size:13px;color:var(--muted);margin:6px 0 0;padding-inline-start:18px}

.tl .what .chip{line-height:1.35;padding:5px 8px;cursor:default;white-space:normal}

.lock-btn{appearance:none;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;font-size:12px;padding:4px 8px;cursor:pointer;white-space:nowrap}

.toast{position:fixed;inset-inline-start:50%;transform:translateX(50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:min(92vw,560px)}

.progress{font-size:13px;color:var(--muted)}

.dot.exc{background:var(--warn)}

.proposal{border:2px solid var(--alarm);border-radius:12px;padding:12px 14px;margin-bottom:16px;background:var(--surface)}

.proposal p{margin:0 0 10px;font-size:13px;color:var(--muted)}
textarea.reason{width:100%;min-height:64px;margin:10px 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);resize:vertical}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

.sh-row{display:grid;grid-template-columns:1fr 104px 34px;gap:6px;align-items:center;margin-bottom:4px}

.excard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}

.load td.v.closed{background:repeating-linear-gradient(135deg,var(--surface-2) 0 4px,transparent 4px 8px)}

.early-row{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
.early-row select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.chk-list{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.chk-list label{display:inline-flex;gap:6px;align-items:center}
.lot-table td,.lot-table th{font-size:13px}
.pill-btn.bad{color:var(--alarm);border-color:color-mix(in srgb,var(--alarm) 45%,transparent)}
.pill-btn small{color:var(--muted);font-weight:400}
tr.muted-row td{opacity:.6}
td details summary{cursor:pointer}
</style>

    return `<tr><th class="name" scope="row">${esc(poolShort(p))}<small>${mx}${MINCAP[p] ? ` (מינ׳ ${MINCAP[p]})` : ''}</small></th>${tds}</tr>`;
  }).join('');
  return capBanners(ctx) + `<p class="progress" style="margin-top:0">מספר הסטודנטים בכל קורס בכל שבוע, כולל עריכות ידניות. אדום = מעל הקיבולת; כתום מפוספס = שורת החירום; אפור מקווקו = שבוע סגור בקובץ השיבוצים; צהוב = מתחת למינימום${under ? ` (${under} שבועות)` : ''}. ליבה ובחירה של אותה מחלקה חולקות את אותם מקומות.</p><div class="board-wrap"><table class="load"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function viewShifts(ctx) {
  if (!startDate()) return `<div class="empty"><h2>חסר תאריך פתיחה</h2><p>כדי לשבץ תורנויות צריך לדעת באילו תאריכים נופלים סופי השבוע והחגים. הגדירו את תאריך הפתיחה של בלוק 1.</p><button class="btn primary" data-act="tab" data-v="settings">להגדרות</button></div>`;
  if (!scheduleUsable()) return `<div class="empty"><h2>קודם משבצים בלוקים</h2><p>התורנויות נקבעות לפי לוח הבלוקים, כי אין תורנות בשבוע חופשה או בבלוק מחוץ לבית החולים.</p><button class="btn primary" data-act="run">שבץ אוטומטית</button></div>`;
  const days = ctx.days, hol = days.filter(d => d.hol).length;
  if (!ctx.shiftsOn) {
    const stale = state.shifts && state.shifts.list;
    return `<div class="empty"><h2>${stale ? 'לוח התורנויות אינו תואם את לוח השנה' : 'עדיין אין שיבוץ תורנויות'}</h2><p>${days.length} ימי תורנות בשנה (${days.length - hol} ימי סוף שבוע, ${hol} חגים). כל סטודנט צריך 10 תורנויות חירום ו-5 תורנויות מחלקות.</p><button class="btn primary" data-act="run-shifts">שיבוץ תורנויות</button></div>`;
  }
  const rows = state.students.filter(s => ctx.rows[s.id] && inGroup(s)).sort(byGroupThenName).map(s => ({s, st: studentState(s, ctx)}));
  const parts = shiftParts(ctx.lists, ctx.dayMap);
  const full = rows.filter(r => r.st.sh && r.st.sh.cnt.er === SHIFT_Q.er && r.st.sh.cnt.dept === SHIFT_Q.dept).length;
  const bad = rows.filter(r => r.st.unapproved.some(i => i.kind === 'shift')).length;
  const toolbar = `<div class="toolbar">
    <ul class="stats" style="margin:0"><li class="${full < rows.length ? 'bad' : ''}"><b>${full}/${rows.length}</b>עם מכסה מלאה</li><li class="${bad ? 'bad' : ''}"><b>${bad}</b>עם התנגשויות</li><li><b>${days.length}</b>ימי תורנות</li><li><b>${ctx.dayCaps.er}/${ctx.dayCaps.dept}</b>מקסימום ביום (חירום/מחלקות)</li></ul>
    <span class="spacer"></span>
    ${groupSelect()}
    <select class="full" data-f="shview" style="width:auto" aria-label="תצוגה"><option value="students" ${state.shView === 'students' ? 'selected' : ''}>לפי סטודנט</option><option value="dates" ${state.shView === 'dates' ? 'selected' : ''}>לפי תאריך</option></select>
    <button class="btn sm" data-act="run-shifts">שיבוץ מחדש</button>
    ${downloads ? '<button class="btn sm" data-act="export-shifts">ייצוא (CSV)</button>' : ''}</div>`;
  const note = `<p class="progress">אין תורנויות בשבועות חופשה, בבלוקים מחוץ לבית החולים וביום כיפור. תורנות מחלקות משובצת בעדיפות כשהסטודנט בבלוק פנימית, כירורגיה או סוסים. תורנות שבת או חג שהוא שבתון מזכה ביום חופש בשבוע שאחרי (שישי וערב חג לא מזכים). ☀ בוקר 8:00–16:00 · 🌙 ערב 16:00–24:00. רשימות שנערכו ידנית נשמרות בשיבוץ מחדש.</p>`;
  if (state.shView === 'dates') {
    const byDay = new Map(days.map(d => [d.d, {er: [], dept: []}]));
    const extra = [];
    rows.forEach(({s}) => (ctx.lists[s.id] || []).forEach(x => { if (!byDay.has(x.d)) { byDay.set(x.d, {er: [], dept: []}); extra.push(x.d); } byDay.get(x.d)[x.t].push(s); }));
    const allDays = [...byDay.keys()].sort();
    const stById = new Map(rows.map(r => [r.s.id, r.st]));
    const names = (list, d, t) => list.filter(s => inGroup(s)).map(s => { const st = stById.get(s.id); const bad = st && st.unapproved.some(i => i.d === d); const pt = parts.get(s.id + '|' + d + '|' + t), dp = shiftDept({d, t}, ctx.rows[s.id], ctx); return `<button class="${bad ? 'bad' : ''}" data-act="shift-sheet" data-id="${s.id}">${esc(s.name || 'ללא שם')} <small>${pt === 'pm' ? '🌙' : '☀'}${t === 'dept' ? ' ' + esc(dp.txt) : ''}</small></button>`; }).join('');
    const body = allDays.map(d => {
      const info = ctx.dayMap.get(d), e = byDay.get(d), dt = new Date(d + 'T12:00:00');
      const cnt = t => `<small class="progress">${e[t].length}/${ctx.dayCaps[t]}</small>`;
      const dl = shiftDayLabel(info, d);
      return `<tr><td><b>${fmtIso(d)}</b><br><small class="progress">${DOW_FULL[dt.getDay()]}${info && info.hol ? ', ' + esc(info.hol) : ''}${dl.tag ? ' · ' + dl.tag : ''}${earnsDayOff(dl.k) ? ' · מזכה ביום חופש' : ''}${!info ? ', לא יום תורנות' : ''}</small></td><td>${cnt('er')}<div class="names">${names(e.er, d, 'er')}</div></td><td>${cnt('dept')}<div class="names">${names(e.dept, d, 'dept')}</div></td></tr>`;
    }).join('');
    return toolbar + note + `<div class="panel tbl-wrap"><table class="plain"><thead><tr><th style="width:120px">תאריך</th><th>חירום</th><th>מחלקות</th></tr></thead><tbody>${body}</tbody></table></div>`;
  }
  let lastG = null;
  const body = rows.map(({s, st}) => {
    const cnt = st.sh ? st.sh.cnt : {er: 0, dept: 0};
    const shIss = st.all.filter(i => i.kind === 'shift'), un = st.unapproved.filter(i => i.kind === 'shift');
    const pill = un.length ? `<span class="pill bad">${esc(un[0].text)}${un.length > 1 ? ` (+${un.length - 1})` : ''}</span>` : shIss.length ? '<span class="pill warn">החרגה מאושרת</span>' : '<span class="pill ok">תקין</span>';
    const lst = ctx.lists[s.id] || [], offN = lst.filter(x => earnsDayOff(shiftDayKind(ctx.dayMap.get(x.d), x.d))).length;
    const next = lst.map(x => shiftChip(x, s.id, ctx.rows[s.id], ctx, parts, st.unapproved.some(i => i.kind === 'shift' && i.d === x.d))).join('');
    let gh = '';
    if (curGroup() === 'all' && groupList().length > 1 && groupKey(s) !== lastG) { lastG = groupKey(s); gh = `<tr class="grp-row"><th colspan="4"><span>${lastG === GRP_NONE ? esc(groupLabel(lastG)) : 'הקבוצה של ' + esc(lastG)}</span></th></tr>`; }
    return gh + `<tr><td><button class="name-btn" data-act="shift-sheet" data-id="${s.id}"><span>${esc(s.name || 'ללא שם')}</span></button>${s.shiftFrozen ? ' <span class="pill mute">ידני</span>' : ''}</td>
      <td class="num">${cnt.er}/${SHIFT_Q.er}</td><td class="num">${cnt.dept}/${SHIFT_Q.dept}</td><td>${pill}${offN ? ` <span class="pill mute">${offN} ימי חופש</span>` : ''}<div class="shchips">${next}</div></td></tr>`;
  }).join('');
  return toolbar + note + `<div class="panel tbl-wrap"><table class="plain"><thead><tr><th>סטודנט</th><th class="num">חירום</th><th class="num">מחלקות</th><th>מצב ותאריכים</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

function viewExceptions() {
  const list = state.exceptions.slice().sort((a, b) => b.at - a.at);
  if (!list.length) return `<div class="empty"><h2>אין החרגות</h2><p>כשעריכה ידנית בלוח הבלוקים או בתורנויות יוצרת התנגשות, היא נשמרת רק אחרי אישור מפורש, ומתועדת כאן עם הנימוק.</p></div>`;
  return `<p class="progress" style="margin-top:0">כל החרגה שאושרה, עם ההתנגשויות שכיסתה והנימוק. ביטול החרגה מחזיר את ההתנגשויות לסטטוס פתוח.</p><div class="slist">` + list.map(e => {
    const s = byId(e.sid), valid = s && ((e.kind === 'block' && s.frozen) || (e.kind === 'shift' && s.shiftFrozen));
    const d = new Date(e.at);
    return `<div class="excard"><h3>${s ? `<button class="name-btn" data-act="${e.kind === 'shift' ? 'shift-sheet' : 'detail'}" data-id="${s.id}"><span>${esc(s.name || 'ללא שם')}</span></button>` : 'סטודנט שנמחק'}
      <span class="pill mute">${e.kind === 'shift' ? 'תורנויות' : 'לוח בלוקים'}</span><span class="pill ${valid ? 'warn' : 'mute'}">${valid ? 'בתוקף' : 'לא בתוקף'}</span></h3>
      <div class="meta">אושר ב-${fmtY(d)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}. ${esc(e.desc || '')}</div>
      <ul>${(e.issues || []).map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      <div class="why">${e.reason ? 'נימוק: ' + esc(e.reason) : 'ללא נימוק'}</div>
      <div><button class="btn sm danger" data-act="revoke-ex" data-ex="${e.id}">ביטול ההחרגה</button></div></div>`;
  }).join('') + '</div>';
}

function viewSettings() {
  const cfg = state.config, w = W(), r = R();
  const {caps, demand, src} = effectiveCaps(state.students.filter(s => !validateChoices(s).length), w, cfg.caps, cfg.vacBlocks, [], gridShift());
  const reqRows = [['ליבה (18.5 בלוקים)', r.core], ['בחירת חובה (טבלה 2)', r.me], ['בחירה משנית (טבלה 3)', r.sec], ['בחירה חופשית (טבלה 4)', r.free], [`חופש (${cfg.vacBlocks} בלוקים = ${r.vac} שבועות)`, r.vac]];
  const arith = `<table class="plain"><thead><tr><th>רכיב</th><th class="num">שבועות</th></tr></thead><tbody>${reqRows.map(x => `<tr><td>${x[0]}</td><td class="num">${x[1]}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>סה״כ דרישות</td><td class="num">${r.total}</td></tr><tr><td>לוח השנה המוגדר</td><td class="num">${w} <span class="pill ${w === r.total ? 'ok' : 'bad'}">${w === r.total ? 'תואם' : 'לא תואם'}</span></td></tr></tfoot></table>
    <p class="hint" style="margin-top:6px">כל שבוע שנעשה כבלוק מוקדם (לפני תחילת השנה) יורד מהשנה ומזכה בשבוע חופש נוסף בתוכה, כך שהשנה נשארת ${w} שבועות.</p>`;
  const groups = [['ליבה (כולל הבחירה של אותה מחלקה)', POOLS.filter(p => C[p] && C[p].core)], ['בחירת חובה ובחירה משנית', POOLS.filter(p => C[p] && !C[p].core && ['L3', 'L4'].includes(C[p].list))], ['בחירה חופשית ובלוקים חיצוניים', POOLS.filter(p => !C[p] || (!C[p].core && C[p].list === 'L5'))]];
  const capRows = groups.map(([g, list]) => `<tr><th colspan="4" style="padding-top:12px;color:var(--ink);font-weight:600">${g}</th></tr>` + list.map(p => {
    const o = cfg.caps[p], arr = caps[p], open = arr.filter(x => x > 0).length, mx = Math.max(0, ...arr);
    const base = src[p] === 'auto' ? `${mx} <span class="pill mute">לפי ביקוש</span>` : GRID[p] ? `עד ${GRID_MAX[p]}${MINCAP[p] ? `, מינ׳ ${MINCAP[p]}` : ''}<br><small class="progress">פתוח ${GRID[p].slice(GRID_PRE + gridShift(), GRID_PRE + gridShift() + w).filter(x => x > 0).length}/${w} שבועות</small>` : mx;
    return `<tr><td>${esc(poolName(p))}<br><small class="progress">${esc(C[p] ? C[p].code : '')}</small></td><td class="num">${demand[p] || 0}</td><td class="num">${base}</td>
      <td class="num"><input type="number" min="0" max="60" inputmode="numeric" data-cap="${p}" value="${o ?? ''}" placeholder="${GRID[p] ? 'קובץ' : 'אוטו׳'}" aria-label="קיבולת ${esc(poolName(p))}"></td></tr>`;
  }).join('')).join('');
  const sc = cfg.shift, hol = parseHolidays(sc.holidays), days = shiftDays();
  const nSched = scheduleUsable() ? state.students.filter(s => state.schedule.rows[s.id]).length : state.students.length;
  const autoSC = autoShiftCaps(nSched, days.length, {});
  const off = cfg.prereqOff || {};
  const ruleRows = ORDER_RULES.map(x => `<label class="inline-check" style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:6px"><input type="checkbox" data-prereq="${x.id}" ${off[x.id] ? '' : 'checked'} style="margin-top:3px"> <span>${esc(x.text)} <small class="progress">(${esc(x.src)})</small></span></label>`).join('');
  return `<div class="cols">
  <div>
    <section class="panel"><h2>לוח השנה – ${YEAR}</h2>
      <div class="grid2">
        <label class="field"><span>מספר בלוקים (שבועיים כל אחד)</span><input type="number" min="10" max="30" data-cfg="slots" value="${cfg.slots}"></label>
        <label class="field"><span>תאריך פתיחת בלוק 1</span><input type="date" data-cfg="start" value="${esc(cfg.start)}"></label>
        <label class="field"><span>בלוקי חופש (שבועיים) לכל סטודנט</span><input type="number" min="1" max="4" data-cfg="vacBlocks" value="${cfg.vacBlocks}"></label>
        <label class="field"><span>שבועות לבלוקים מוקדמים לפני תחילת השנה</span><input type="number" min="0" max="20" data-cfg="pre" value="${r.pre}"></label>
      </div>
      ${startDate() && r.pre ? `<p class="hint">בלוקים מוקדמים: מ-${fmtY(preWeekStart(0))} עד ${fmtY(addDays(startDate(), -1))}.</p>` : ''}
      ${arith}
    </section>
    <section class="panel" style="margin-top:16px"><h2>הגרלה ובלוק מיומנויות</h2>
      <p class="hint">כשהביקוש לבלוק בחירה עולה על מספר המקומות בשנה נערכת הגרלה. מי שזכה בהגרלה אחת מקבל עדיפות נמוכה יותר בהגרלה הבאה, ומי שהפסיד עובר לבלוק הגיבוי שבחר.</p>
      <div class="grid2">
        <label class="field"><span>ניצולת מקסימלית של מקומות (0.5–1)</span><input type="number" min="0.5" max="1" step="0.05" data-cfg="lotMargin" value="${cfg.lotMargin}"></label>
        <label class="field"><span>מינימום נרשמים לפתיחת בלוק מיומנויות</span><input type="number" min="1" max="100" data-cfg="skillsMin" value="${cfg.skillsMin}"></label>
      </div>
      <button class="btn sm" data-act="lottery">פתיחת ההגרלה</button>
    </section>
    <section class="panel" style="margin-top:16px"><h2>סדר ודרישות קדם</h2>
      <p class="hint" style="margin:0 0 8px">כל כלל מסומן נאכף בשיבוץ האוטומטי ומסומן כהתנגשות בעריכה ידנית. כללים משני המקורות פעילים יחד; בטלו את מה שהוועדה לא אישרה.</p>
      ${ruleRows}
    </section>
    <section class="panel" style="margin-top:16px"><h2>תורנויות</h2>
      <p class="hint">15 תורנויות לכל סטודנט: 10 חירום ו-5 מחלקות. ללא מכסה מלאה אין גישה לבחינות הגמר. ימי התורנות הם ימי סוף השבוע המסומנים והחגים ברשימה (רשימת ${YEAR} מהשאלון נטענה מראש).</p>
      <div class="dow" role="group" aria-label="ימי סוף שבוע">${DOW_S.map((d, i) => `<label><input type="checkbox" data-dow="${i}" ${(sc.days || []).includes(i) ? 'checked' : ''}> ${d}</label>`).join('')}</div>
      <label class="field"><span>חגים ומועדים (שורה לכל תאריך: 2027-04-22 פסח)</span><textarea data-shcfg="holidays" placeholder="2027-04-22 פסח">${esc(sc.holidays)}</textarea>${hol.bad ? `<small style="color:var(--alarm)">${hol.bad} שורות לא זוהו – יש לכתוב תאריך בפורמט שנה-חודש-יום</small>` : ''}</label>
      <div class="grid2">
        <label class="field"><span>מקסימום תורני חירום ביום</span><input type="number" min="0" data-shcfg="erCap" value="${esc(sc.erCap)}" placeholder="אוטו׳ (${autoSC.er})"></label>
        <label class="field"><span>מקסימום תורני מחלקות ביום</span><input type="number" min="0" data-shcfg="deptCap" value="${esc(sc.deptCap)}" placeholder="אוטו׳ (${autoSC.dept})"></label>
        <label class="field"><span>מרווח מועדף בין תורנויות (ימים)</span><input type="number" min="0" max="60" data-shcfg="minGap" value="${esc(sc.minGap)}"></label>
      </div>
      <p class="hint">${startDate() ? `${days.length} ימי תורנות בשנת הבלוקים.` : 'הגדירו תאריך פתיחה כדי לחשב את ימי התורנות.'} אין תורנות בשבוע חופש או בבלוק מחוץ לבית החולים.</p>
    </section>
    ${caseSettingsPanel()}
    <section class="panel" style="margin-top:16px"><h2>מנוע השיבוץ</h2>
      <p class="hint">כללי חובה אינם נעקפים אוטומטית: כל הבלוקים, אורכים, סדר ודרישות קדם, קורסים שאינם מתקיימים וקיבולות. חריגה אפשרית רק בעריכה ידנית עם אישור החרגה.</p>
      <div class="grid2">
        <label class="field"><span>משקל העדפות חופש</span><input type="number" min="0" max="20" step="0.5" data-cfg="prefW" value="${cfg.prefW}"></label>
        <label class="field"><span>זרע אקראיות (לשחזור תוצאה)</span><input type="number" min="1" data-cfg="seed" value="${cfg.seed}"></label>
      </div>
      <h3 style="font-size:14px;margin:6px 0 4px">קיבולת, מינימום ושורת חירום</h3>
      <p class="hint" style="margin:0 0 6px">השיבוץ האוטומטי לא משבץ אף פעם בשבוע סגור, לא חורג מהקיבולת ולא משאיר שבוע עם פחות סטודנטים מהמינימום (שבוע ריק מותר). חריגה נשארת רק כשאין מספיק מקומות בכל השנה, ואז היא מסומנת באדום עם הסבר.</p>
      <p class="hint" style="margin:0 0 4px">מחלקות שלא מתפקדות בלי סטודנטים – כל שבוע פתוח חייב להגיע למינימום (שבוע ריק נחשב חוסר):</p>

function openSheet(obj) { state.sheet = obj; renderSheet(); const el = document.getElementById('sheet'); el.hidden = false; el.querySelector('.sheet-panel').scrollTop = 0; setTimeout(() => { const f = el.querySelector('input,select,button'); if (f) f.focus({preventScroll: true}); }, 30); }
function closeSheet() { state.sheet = null; document.getElementById('sheet').hidden = true; render(); }
let sheetRendering = false;
function renderSheet() {
  if (!state.sheet) return;

  sheetRendering = true;
  try { renderSheetInner(); } finally { sheetRendering = false; }
}
function renderSheetInner() {
  if (!state.sheet) return;

function bkOptions(cat, cur) {

function earlyUnitOptions(s, cur) {

  if (s.me) opts.push([`${s.me}|me|2`, `${fullName(s.me)} (בחירת חובה)`]);
  (s.sec || []).filter(r => r.c).forEach(r => opts.push([`${r.c}|sec|${r.w}`, `${fullName(r.c)} – ${+r.w === 1 ? 'שבוע' : 'שבועיים'} (משנית)`]));

  return opts.map(([v, t]) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(t)}</option>`).join('');

// the student list: a column headed "שם סטודנט" / "שם הסטודנט", with the group coordinator ("אחראי") next to it
function legacyRoster(wb, X) {
  const out = new Map();
  wb.SheetNames.forEach(nm => {
    const rows = legSheet(wb, X, nm);
    for (let r = 0; r < Math.min(rows.length, 6); r++) {
      const nj = rows[r].findIndex(v => /^שם (ה)?סטודנט/.test(String(v).trim()));

// the week grid: one row per seat of a course, one column per week, a student's name in every week they are there
function legacyGrid(wb, X) {

  wb.SheetNames.forEach(nm => {
    const rows = legSheet(wb, X, nm);
    let hdr = -1, cols = [];
    for (let r = 0; r < Math.min(rows.length, 12); r++) {
      const c = []; rows[r].forEach((v, j) => { if (typeof v === 'string') { const d = legacyWeekStart(v); if (d) c.push({j, d}); } });
      if (c.length >= 20 && c.length > cols.length) { hdr = r; cols = c; }
    }
    if (hdr < 0) return;
    const first = Math.min(...cols.map(c => c.j));
    let lblCol = -1, score = 0;
    for (let j = 0; j < first; j++) {
      let n = 0; for (let i = hdr + 1; i < rows.length; i++) if (legacyKey(rows[i][j])) n++;
      if (n > score) { score = n; lblCol = j; }
    }
    if (lblCol < 0 || score < 10) return;
    let one = null;
    for (let r = 0; r < Math.min(rows.length, 12) && !one; r++) {
      const j = rows[r].findIndex(v => /^בלוק\s*1$/.test(String(v).trim()));

// presentation dates: per student ("תאריך הצגת מקרה 1/2") and/or per date (a row of Tuesdays with names under it)

  let found = false;
  wb.SheetNames.forEach(nm => {
    const rows = legSheet(wb, X, nm);
    for (let r = 0; r < Math.min(rows.length, 6); r++) {
      const nj = rows[r].findIndex(v => /^שם (ה)?סטודנט/.test(String(v).trim()));
      const dj = rows[r].map((v, j) => /הצגת מקרה/.test(String(v)) ? j : -1).filter(j => j >= 0);
      if (nj < 0 || !dj.length) continue;
      const nj2 = rows[r].findIndex(v => /^השלמות/.test(String(v).trim()));

      for (let i = r + 1; i < rows.length; i++) {

        dj.forEach(j => add(k, legacyDate(rows[i][j])));

      }

function legacyPlan(wb, X, file) {

function legacyApply() {

function propose(p) {

  if (!issues.length && !p.review) { applyChange(p, null); toast('נשמר. לא נמצאו התנגשויות.'); return; }

}
function applyChange(p, exception) {

    const sch = state.schedule, fresh = sch.hash === inputHash();
    sch.rows[s.id] = p.row;

    p.touched.forEach(sl => { s.locks[sl] = [p.row[2 * sl], p.row[2 * sl + 1]]; });
    if (exception) { s.frozen = true; for (let sl = 0; sl < p.row.length / 2; sl++) s.locks[sl] = [p.row[2 * sl], p.row[2 * sl + 1]]; }
    if (!rowIssues(p.row, R(), null, null, s).length) syncChoices(s, p.row);
    if (fresh) sch.hash = inputHash();
    persist('schedule');
    if (p.list && state.shifts && state.shifts.list) { state.shifts.list[s.id] = p.list.slice(); persist('shifts'); }
  } else {
    state.shifts.list[s.id] = p.list.slice().sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
    s.shiftFrozen = true;
    persist('shifts');
  }
  if (p.shiftBlock) s.shiftBlock = clone(p.shiftBlock);
  if (p.vacPref) s.vac = p.vacPref.slice();
  if (p.reqId) { const r = state.requests.find(x => x.rid === p.reqId); if (r) { r.status = 'approved'; r.decided = Date.now(); r.sid = s.id; r.note = ''; persist('requests'); } }
  if (exception) { state.exceptions.push(exception); persist('exceptions'); }
  persist('roster');

}
// choices mirror the edited row, so a later automatic run keeps the edit instead of undoing it
function syncChoices(s, row) {

function randomPicks(pool, total) {

    const rows = [], used = new Set(); let rem = total, guard = 0;
    while (rem > 0 && guard++ < 50) {
      const cand = pool.filter(k => !used.has(k) && C[k].len.some(l => l <= rem));
      if (!cand.length) break;
      const k = cand[Math.floor(Math.random() * cand.length)], lens = C[k].len.filter(l => l <= rem), w = lens[Math.floor(Math.random() * lens.length)];
      rows.push({c: k, w}); used.add(k); rem -= w;
    }
    if (rem === 0) return rows;
  }
  return [];
}

    case 'req-delete': armed(t, () => { state.requests = state.requests.filter(x => x.rid !== t.dataset.rid); persist('requests'); render(); }); break;
    case 'export-csv': exportCsv(); break;
    case 'export-dept': exportDeptCsv(); break;
    case 'soc-edit': openSheet({type: 'social', id: t.dataset.id}); break;
    case 'fr-del': { const s = byId(t.dataset.id); if (s) { s.friends = friendsOf(s).filter(x => x !== t.dataset.fid); persist('roster'); render(); } break; }
    case 'fr-auto': { const s = byId(t.dataset.id); if (s) { delete s.friends; persist('roster'); render(); } break; }
    case 'export-shifts': exportShifts(); break;
    case 'save-now': saveNow(); break;
    case 'gs-sync': gsSync(true); break;
    case 'gs-copy': copyText(GS_URL, document.getElementById('gsUrl')); break;
    case 'staff-full': staffRun(staffFull); break;
    case 'staff-dept': { const sel = document.querySelector('[data-f=staff-dept]'); const v = sel ? sel.value : state.staffDept; if (v) staffRun(() => staffDept(v)); break; }
    case 'staff-dept-all': staffRun(() => staffDept('all')); break;
    case 'staff-cases': staffRun(staffCases); break;
    case 'staff-shifts': { const v = t.dataset.p; staffRun(() => staffShifts(v)); break; }
    case 'local-restore': { const d = state.localCopy; state.localCopy = null; if (!d) break;
      state.students = d.students.map(normStudent); applyConfig(d.config || {});
      state.schedule = d.schedule && d.schedule.rows ? d.schedule : null; state.shifts = d.shifts && d.shifts.list ? d.shifts : null;
      state.exceptions = Array.isArray(d.exceptions) ? d.exceptions : []; state.requests = Array.isArray(d.requests) ? d.requests : [];
      state.publish = d.publish && d.publish.ver ? d.publish : null; state.cases = d.cases && d.cases.list ? d.cases : null;
      persist(...DOCS); render(); saveNow(); break; }
    case 'local-dismiss': state.localCopy = null; try { localStorage.removeItem(LS_KEY + ':copy'); } catch (e) { /* ignore */ } render(); break;
    case 'export-json': saveFile('gibui-shibutz.json', JSON.stringify({version: 3, students: state.students, config: state.config, schedule: state.schedule, shifts: state.shifts, exceptions: state.exceptions, requests: state.requests, publish: state.publish, cases: state.cases}, null, 1)); break;
    case 'import-json': document.getElementById('importFile').click(); break;
    case 'clear-all': armed(t, () => { state.students = []; state.schedule = null; state.shifts = null; state.exceptions = []; state.requests = []; state.publish = null; state.cases = null; state.pubBundle = ''; persist('roster', 'schedule', 'shifts', 'exceptions', 'requests', 'publish', 'cases'); render(); toast('כל הנתונים נמחקו.'); }); break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f === 'name') { const s = byId(t.dataset.id); if (s) { s.name = t.value; persist('roster'); } }
  if (t.dataset.f === 'st-q') { state.stQuery = t.value; const w = document.getElementById('slistWrap'); if (w) w.innerHTML = studentRowsHtml(); return; }
  if (t.dataset.f === 'grp') { const s = byId(t.dataset.id); if (s) { s.qa = {...(s.qa || {}), group: t.value}; persist('roster'); } return; }
  if (['sno', 'contact', 'snotes'].includes(t.dataset.f)) { const s = byId(t.dataset.id); if (s) { s[t.dataset.f === 'snotes' ? 'notes' : t.dataset.f] = t.value; persist('roster'); } }
});
document.addEventListener('change', e => {
  const t = e.target, f = t.dataset.f;
  if (['name', 'sno', 'contact', 'snotes', 'grp'].includes(f)) { render(); return; }
  if (f === 'group') { setGroup(t.value); render(); return; }
  if (f === 'staff-dept') { state.staffDept = t.value; return; }
  if (f === 'fr-add') { const s = byId(t.dataset.id); if (s && t.value) { s.friends = [...friendsOf(s), t.value]; persist('roster'); render(); } return; }
  if (f === 'fill') { const fs = fillSet(); t.checked ? fs.add(t.dataset.p) : fs.delete(t.dataset.p); state.config.fill = [...fs]; persist('config'); render(); return; }
  if (f === 'colmode') { state.colorMode = t.value; lsPut(LS_COL, t.value); render(); return; }
  if (f === 'zoom') { state.zoom = t.value; lsPut(LS_ZOOM, t.value); render(); return; }
  if (f === 'filter') { state.filter = t.value; render(); return; }
  if (f === 'shview') { state.shView = t.value; render(); return; }
  if (f === 'dept-p') { state.deptP = t.value; render(); return; }
  if (f === 'dept-hi') { state.deptHi = t.value || null; render(); return; }
  if (f === 'caseview') { state.caseView = t.value; render(); return; }
  if (t.dataset.casecfg) { const k = t.dataset.casecfg; let v = t.value; if (k !== 'closed') v = Math.max(k === 'dow' ? 0 : 1, Math.min(k === 'dow' ? 6 : 60, Math.round(+v) || DEFAULT_CFG.cases[k])); state.config.cases = {...state.config.cases, [k]: v}; persist('config'); render(); return; }
  if (f === 'case-d' || f === 'case-f') { const s0 = byId(state.sheet && state.sheet.id); if (!s0) return; const cc = caseCtx(), l = (cc.lists[s0.id] || []).map(x => ({...x})), x = l[+t.dataset.i]; if (!x) return;
    if (f === 'case-d') { x.d = t.value; const day = cc.dayMap.get(x.d), sug = day && CASE_FIELD_OF[parseCell((cc.rows[s0.id] || [])[day.w] || '').c]; if (sug && !l.some((y, j) => j !== +t.dataset.i && y.f === sug)) x.f = sug; } else x.f = t.value;
    setCases(s0, l); return; }
  if (f === 'req-filter') { state.reqFilter = t.value; render(); return; }
  if (f === 'st-filter') { state.stFilter = t.value; render(); return; }
  if (f === 'st-sel' || f === 'st-all') {
    const sel = stSel();
    if (f === 'st-sel') { if (t.checked) sel.add(t.dataset.id); else sel.delete(t.dataset.id); }
    else document.querySelectorAll('[data-f=st-sel]').forEach(x => { if (t.checked) sel.add(x.dataset.id); else sel.delete(x.dataset.id); });
    refreshStudentList(); return;
  }
  if (f === 'req-match') { const r = state.requests.find(x => x.rid === t.dataset.rid); if (r) { r.match = t.value; persist('requests'); render(); } return; }
  if (f === 'blk-dow') { const s = byId(state.sheet.id); if (!s) return; const set = new Set(s.shiftBlock.dows); t.checked ? set.add(+t.dataset.i) : set.delete(+t.dataset.i); s.shiftBlock.dows = [...set].sort(); persist('roster'); render(); return; }
  if (f === 'blk-dates') { const s = byId(state.sheet.id); if (!s) return; s.shiftBlock.dates = (t.value.match(/\d{4}-\d{2}-\d{2}/g) || []).sort(); persist('roster'); renderSheet(); render(); return; }
  if (f === 'se-mode') { const half = t.value === 'half'; document.getElementById('seBWrap').hidden = !half; return; }
  if (t.dataset.cfg) {
    const k = t.dataset.cfg; let v = t.value;
    if (k === 'slots') v = Math.max(10, Math.min(30, Math.round(+v) || 26));
    else if (k === 'vacBlocks') v = Math.max(1, Math.min(4, Math.round(+v) || 2));
    else if (k === 'pre') v = Math.max(0, Math.min(20, Math.round(+v) || 0));
    else if (k === 'lotMargin') v = Math.max(0.5, Math.min(1, +v || 1));
    else if (k === 'skillsMin') v = Math.max(1, Math.round(+v) || 35);
    else if (k === 'seed') v = Math.max(1, Math.round(+v) || 1);
    else if (k === 'prefW') v = Math.max(0, +v || 0);
    else if (t.type === 'checkbox') v = t.checked;
    state.config[k] = v; persist('config'); render(); return;
  }
  if (t.dataset.shcfg) { const k = t.dataset.shcfg; state.config.shift[k] = k === 'holidays' ? t.value : t.value.trim(); persist('config'); render(); return; }
  if (t.dataset.dow !== undefined) { const d = +t.dataset.dow, cur = new Set(state.config.shift.days || []); t.checked ? cur.add(d) : cur.delete(d); state.config.shift.days = [...cur].sort(); persist('config'); render(); return; }
  if (t.dataset.prereq) { state.config.prereqOff = {...(state.config.prereqOff || {})}; if (t.checked) delete state.config.prereqOff[t.dataset.prereq]; else state.config.prereqOff[t.dataset.prereq] = true; persist('config'); render(); return; }
  if (t.dataset.cap) { const v = t.value.trim(); if (v === '') delete state.config.caps[t.dataset.cap]; else state.config.caps[t.dataset.cap] = Math.max(0, Math.round(+v)); persist('config'); render(); return; }
  const s = state.sheet && byId(state.sheet.id); if (!s) return;
  if (f === 'sh-part') {
    const list = (state.shifts.list[s.id] || []).map(x => ({...x})), i = +t.dataset.i; list[i].p = t.value;
    state.shifts.list[s.id] = list; s.shiftFrozen = true; persist('shifts', 'roster'); renderSheet(); render(); return;
  }
  if (f === 'sh-date' || f === 'sh-type') {
    const list = (state.shifts.list[s.id] || []).map(x => ({...x})), i = +t.dataset.i, old = {...list[i]};
    if (f === 'sh-date') { if (!t.value) { renderSheet(); return; } list[i].d = t.value; } else list[i].t = t.value;
    propose({kind: 'shift', sid: s.id, list, desc: f === 'sh-date' ? `העברת תורנות ${SHIFT_T[old.t]} מ-${fmtIso(old.d)} ל-${fmtIso(t.value)}` : `שינוי תורנות ${fmtIso(old.d)} ל${SHIFT_T[t.value]}`});
    return;
  }
  if (f === 'bk-c' || f === 'bk-w') {
    const key = t.dataset.cat === 'sec' ? 'secBk' : 'freeBk';
    if (f === 'bk-c') { const c = C[t.value]; s[key] = c ? {c: t.value, w: s[key] && c.len.includes(+s[key].w) ? +s[key].w : c.len[c.len.length - 1]} : null; }
    else if (s[key]) s[key].w = +t.value;
    persist('roster'); renderSheet(); return;
  }
  if (f === 'skills') { s.skills = t.checked; if (!s.skills) s.skillsDrop = []; persist('roster'); renderSheet(); return; }
  if (f === 'skdrop') { const set = new Set(s.skillsDrop || []); t.checked ? set.add(t.dataset.c) : set.delete(t.dataset.c); s.skillsDrop = [...set]; persist('roster'); renderSheet(); return; }
  if (f === 'tech') { s.tech = t.checked; persist('roster'); renderSheet(); render(); return; }
  if (f === 'early-u' || f === 'early-wk') {
    const e = s.early[+t.dataset.i]; if (!e) return;
    if (f === 'early-u') { const [c, cat, w] = t.value.split('|'); e.c = c; e.cat = cat; e.w = +w; e.wk = Math.min(+e.wk, Math.max(0, preN() - e.w)); }
    else e.wk = +t.value;
    persist('roster'); renderSheet(); render(); return;
  }
  if (['me', 'rowc', 'roww'].includes(f) && (s.orig || s.lot)) { s.orig = null; s.lot = null; }
  if (f === 'me') s.me = t.value;
  else if (f === 'rowc') { const r = s[t.dataset.cat][+t.dataset.i]; r.c = t.value; const c = C[r.c]; if (c && !c.len.includes(+r.w)) r.w = c.len[0]; }
  else if (f === 'roww') s[t.dataset.cat][+t.dataset.i].w = +t.value;
  else return;
  persist('roster'); renderSheet(); render();
});
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.students)) throw new Error('bad');
    state.students = d.students.map(normStudent); applyConfig(d.config || {});
    state.schedule = d.schedule && d.schedule.rows ? d.schedule : null;
    state.shifts = d.shifts && d.shifts.list ? d.shifts : null;
    state.exceptions = Array.isArray(d.exceptions) ? d.exceptions : [];
    state.requests = Array.isArray(d.requests) ? d.requests : [];
    state.publish = d.publish && d.publish.ver ? d.publish : null;
        state.cases = d.cases && d.cases.list ? d.cases : null;
    persist(...DOCS); state.view = null; render();
    toast(`שוחזרו ${state.students.length} סטודנטים מהגיבוי.`);
  } catch (err) { toast('הקובץ אינו גיבוי תקין של הלוח.'); }
});
document.getElementById('legacyFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) legacyImportFile(f); });
document.getElementById('xlsFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importPrefFile(f); });
document.getElementById('reqFile').addEventListener('change', async e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importCodes(await f.text()); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.sheet) closeSheet(); });

init();

</script>
